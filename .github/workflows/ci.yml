name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm test
      - name: Verify required files
        run: |
          test -f index.html
          test -f app.js
          test -f sw.js
          test -f api/djen.js
          test -f api/v1/comunicacao.js
